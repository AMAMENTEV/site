<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой профиль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="messenger.html" class="back-btn">← Мессенджер</a>
      <button onclick="logout()" class="logout-small-header">Выйти</button>
    </div>
    
    <div id="profileContent" class="profile-page">
      <div class="loading">Загрузка профиля...</div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      console.log('Profile page - auth state:', user ? user.email : 'no user');
      
      if (!user || !user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      
      const profileContent = document.getElementById('profileContent');
      
      try {
        // Получаем данные из Firestore
        const userDoc = await db.collection('users').doc(user.uid).get();
        
        if (!userDoc.exists) {
          console.log('Профиль не найден в Firestore, создаем...');
          
          // Если профиля нет, создаем его из данных Auth
          let nickname = 'Пользователь';
          let tag = '';
          
          if (user.displayName) {
            const parts = user.displayName.split('|');
            nickname = parts[0] || 'Пользователь';
            tag = parts[1] || '';
          }
          
          await db.collection('users').doc(user.uid).set({
            nickname: nickname,
            tag: tag,
            email: user.email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          console.log('Профиль создан');
          window.location.reload();
          return;
        }
        
        const userData = userDoc.data();
        console.log('Данные профиля:', userData);
        
        profileContent.innerHTML = `
          <h1>Мой профиль</h1>
          
          <div class="profile-avatar-placeholder">
            <div class="avatar-large">${userData.nickname ? userData.nickname.charAt(0).toUpperCase() : '?'}</div>
          </div>
          
          <div class="profile-info">
            <div class="info-row">
              <label>Никнейм:</label>
              <span id="nickname">${userData.nickname || 'Не указан'}</span>
              <button onclick="editNickname()" class="edit-btn">✎</button>
            </div>
            
            <div class="info-row">
              <label>Тег:</label>
              <span id="tag">${userData.tag || 'Не указан'}</span>
              <button onclick="editTag()" class="edit-btn">✎</button>
            </div>
            
            <div class="info-row">
              <label>Email:</label>
              <span>${userData.email}</span>
            </div>
          </div>
          
          <div class="profile-actions">
            <button onclick="saveChanges()" class="save-btn" id="saveBtn" style="display: none;">
              Сохранить изменения
            </button>
          </div>
          
          <div id="message" class="message"></div>
        `;
        
      } catch (error) {
        console.error('❌ Ошибка загрузки профиля:', error);
        profileContent.innerHTML = '<div class="error">Ошибка загрузки профиля</div>';
      }
    });
    
    let changes = {};
    
    function editNickname() {
      const span = document.getElementById('nickname');
      const current = span.textContent;
      span.innerHTML = `<input type="text" id="editNickname" value="${current}" class="edit-input">`;
      changes.nickname = true;
      document.getElementById('saveBtn').style.display = 'block';
    }
    
    function editTag() {
      const span = document.getElementById('tag');
      const current = span.textContent;
      span.innerHTML = `<input type="text" id="editTag" value="${current}" placeholder="@tag" class="edit-input">`;
      changes.tag = true;
      document.getElementById('saveBtn').style.display = 'block';
    }
    
    async function saveChanges() {
      const user = auth.currentUser;
      const messageDiv = document.getElementById('message');
      
      const updates = {};
      
      if (changes.nickname) {
        updates.nickname = document.getElementById('editNickname').value;
      }
      
      if (changes.tag) {
        updates.tag = document.getElementById('editTag').value;
      }
      
      try {
        await db.collection('users').doc(user.uid).update(updates);
        
        const newDisplayName = `${updates.nickname || document.getElementById('nickname').textContent}|${updates.tag || document.getElementById('tag').textContent}`;
        await user.updateProfile({
          displayName: newDisplayName
        });
        
        messageDiv.innerHTML = '<div class="success">Изменения сохранены!</div>';
        setTimeout(() => {
          window.location.reload();
        }, 1500);
        
      } catch (error) {
        console.error('Ошибка сохранения:', error);
        messageDiv.innerHTML = '<div class="error">Ошибка при сохранении</div>';
      }
    }
    
    function logout() {
      auth.signOut()
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          console.error('Ошибка при выходе:', error);
          alert('Ошибка при выходе из аккаунта');
        });
    }
  </script>
</body>
</html>
