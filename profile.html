<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой профиль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="messenger.html" class="back-btn">← Мессенджер</a>
    </div>
    
    <div id="profileContent" class="profile-page">
      <!-- Содержимое будет заполнено -->
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // Загрузка профиля
    auth.onAuthStateChanged(async (user) => {
      if (!user || !user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      
      const profileContent = document.getElementById('profileContent');
      
      // Получаем данные из Firestore
      const userDoc = await db.collection('users').doc(user.uid).get();
      const userData = userDoc.data() || {
        nickname: 'Пользователь',
        tag: ''
      };
      
      profileContent.innerHTML = `
        <h1>Мой профиль</h1>
        
        <div class="profile-avatar-placeholder">
          <div class="avatar-large">${userData.nickname.charAt(0).toUpperCase()}</div>
        </div>
        
        <div class="profile-info">
          <div class="info-row">
            <label>Никнейм:</label>
            <span id="nickname">${userData.nickname}</span>
            <button onclick="editNickname()" class="edit-btn">✎</button>
          </div>
          
          <div class="info-row">
            <label>Тег:</label>
            <span id="tag">${userData.tag}</span>
            <button onclick="editTag()" class="edit-btn">✎</button>
          </div>
          
          <div class="info-row">
            <label>Email:</label>
            <span>${userData.email}</span>
          </div>
        </div>
        
        <div class="profile-actions">
          <button onclick="saveChanges()" class="save-btn" id="saveBtn" style="display: none;">
            Сохранить изменения
          </button>
          <button onclick="logout()" class="logout-btn">Выйти из аккаунта</button>
        </div>
        
        <div id="message" class="message"></div>
      `;
    });
    
    let changes = {};
    
    function editNickname() {
      const span = document.getElementById('nickname');
      const current = span.textContent;
      span.innerHTML = `<input type="text" id="editNickname" value="${current}">`;
      changes.nickname = true;
      document.getElementById('saveBtn').style.display = 'block';
    }
    
    function editTag() {
      const span = document.getElementById('tag');
      const current = span.textContent;
      span.innerHTML = `<input type="text" id="editTag" value="${current}" placeholder="@tag">`;
      changes.tag = true;
      document.getElementById('saveBtn').style.display = 'block';
    }
    
    async function saveChanges() {
      const user = auth.currentUser;
      const messageDiv = document.getElementById('message');
      
      const updates = {};
      
      if (changes.nickname) {
        updates.nickname = document.getElementById('editNickname').value;
      }
      
      if (changes.tag) {
        updates.tag = document.getElementById('editTag').value;
      }
      
      try {
        // Обновляем в Firestore
        await db.collection('users').doc(user.uid).update(updates);
        
        // Обновляем displayName в Auth
        const currentUserDoc = await db.collection('users').doc(user.uid).get();
        const currentData = currentUserDoc.data();
        const newDisplayName = `${currentData.nickname}|${currentData.tag}`;
        await user.updateProfile({
          displayName: newDisplayName
        });
        
        messageDiv.innerHTML = '<div class="success">Изменения сохранены!</div>';
        setTimeout(() => {
          window.location.reload();
        }, 1500);
        
      } catch (error) {
        messageDiv.innerHTML = '<div class="error">Ошибка при сохранении</div>';
      }
    }
    
    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    }
  </script>
</body>
</html>
