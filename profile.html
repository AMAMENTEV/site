<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <div id="profileContent" style="text-align: center;">
      <!-- Содержимое будет заполнено через JavaScript -->
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // Проверяем авторизацию
    auth.onAuthStateChanged((user) => {
      const profileContent = document.getElementById('profileContent');
      
      if (!user || !user.emailVerified) {
        // Если не авторизован или email не подтвержден - отправляем на вход
        window.location.href = 'index.html';
        return;
      }
      
      // Парсим ник и тег из displayName (формат: "никнейм|@тег")
      let nickname = 'Пользователь';
      let tag = '';
      
      if (user.displayName) {
        const parts = user.displayName.split('|');
        nickname = parts[0] || 'Пользователь';
        tag = parts[1] || '';
      }
      
      // Показываем только приветствие
      profileContent.innerHTML = `
        <h1>Профиль</h1>
        <div class="welcome-message">
          <h2>Hello, ${nickname} ${tag}</h2>
          <p style="margin-top: 10px; color: #666;">${user.email}</p>
        </div>
        <button onclick="logout()" class="logout-btn" style="margin-top: 20px;">
          Выйти из аккаунта
        </button>
      `;
    });
    
    function logout() {
      auth.signOut()
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          alert('Ошибка при выходе: ' + error.message);
        });
    }
  </script>
</body>
</html>
