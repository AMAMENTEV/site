<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой профиль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <a href="messenger.html" class="back-btn"><</a>
      <button onclick="logout()" class="logout-small-header">Выйти</button>
    </div>
    
    <div class="profile-two-columns">
      <!-- Левая колонка - информация о пользователе -->
      <div class="profile-left">
        <div class="profile-card">
          <div class="profile-avatar-placeholder">
            <div class="avatar-large" id="profileAvatar">
              <div class="skeleton-circle"></div>
            </div>
          </div>
          
          <div class="profile-info" id="profileInfo">
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
          </div>
        </div>
      </div>
      
      <!-- Правая колонка - посты -->
      <div class="profile-right">
        <div class="posts-header">
          <h2>Мои посты</h2>
          <button onclick="showCreatePostModal()" class="create-post-btn">+ Новый пост</button>
        </div>
        
        <div class="posts-container" id="postsContainer">
          <div class="skeleton-post"></div>
          <div class="skeleton-post"></div>
          <div class="skeleton-post"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно для создания поста -->
  <div id="postModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Создать новый пост</h3>
        <button onclick="hideCreatePostModal()" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="postContent" placeholder="Что у вас нового?" rows="5"></textarea>
      </div>
      <div class="modal-footer">
        <button onclick="hideCreatePostModal()" class="modal-cancel-btn">Отмена</button>
        <button onclick="createPost()" class="modal-save-btn">Опубликовать</button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // Кэш для данных пользователя
    const userCache = new Map();
    let currentUser = null;
    let currentUserData = null;
    let unsubscribePosts = null;
    let isSubmitting = false; // Флаг для блокировки повторных нажатий

    // Функция для показа скелетонов
    function showSkeletons() {
      document.getElementById('profileInfo').innerHTML = `
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      `;
      document.getElementById('postsContainer').innerHTML = `
        <div class="skeleton-post"></div>
        <div class="skeleton-post"></div>
        <div class="skeleton-post"></div>
      `;
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user || !user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      
      currentUser = user;
      
      // Проверяем кэш
      if (userCache.has(user.uid)) {
        currentUserData = userCache.get(user.uid);
        loadProfileInfo();
        loadPosts();
        return;
      }
      
      try {
        // Параллельная загрузка данных
        const [userDoc, postsSnapshot] = await Promise.all([
          db.collection('users').doc(user.uid).get(),
          db.collection('posts')
            .where('userId', '==', user.uid)
            .orderBy('createdAt', 'desc')
            .limit(20) // Ограничиваем количество постов
            .get()
        ]);
        
        if (!userDoc.exists) {
          window.location.reload();
          return;
        }
        
        currentUserData = userDoc.data();
        userCache.set(user.uid, currentUserData);
        
        // Обновляем аватар
        document.getElementById('profileAvatar').innerHTML = 
          currentUserData.nickname ? currentUserData.nickname.charAt(0).toUpperCase() : '?';
        
        loadProfileInfo();
        
        // Отображаем посты сразу
        if (postsSnapshot.empty) {
          document.getElementById('postsContainer').innerHTML = '<div class="no-posts">У вас пока нет постов. Создайте первый!</div>';
        } else {
          displayPosts(postsSnapshot);
        }
        
        // Запускаем слушатель только для новых постов
        listenForNewPosts();
        
      } catch (error) {
        console.error('Ошибка загрузки профиля:', error);
        document.getElementById('profileInfo').innerHTML = '<div class="error">Ошибка загрузки профиля</div>';
      }
    });

    function loadProfileInfo() {
      const profileInfo = document.getElementById('profileInfo');
      
      profileInfo.innerHTML = `
        <div class="info-row">
          <label>Никнейм:</label>
          <span id="nickname">${currentUserData.nickname || 'Не указан'}</span>
          <button onclick="editNickname()" class="edit-btn">✎</button>
        </div>
        
        <div class="info-row">
          <label>Тег:</label>
          <span id="tag">${currentUserData.tag || 'Не указан'}</span>
          <button onclick="editTag()" class="edit-btn">✎</button>
        </div>
        
        <div class="info-row">
          <label>Email:</label>
          <span>${currentUserData.email}</span>
        </div>
      `;
    }

    function displayPosts(snapshot) {
      const postsContainer = document.getElementById('postsContainer');
      let postsHTML = '';
      
      snapshot.forEach(doc => {
        const post = doc.data();
        let date = 'Только что';
        if (post.createdAt) {
          try {
            date = new Date(post.createdAt.toDate()).toLocaleString();
          } catch (e) {
            date = 'Только что';
          }
        }
        
        postsHTML += `
          <div class="post-card" id="post-${doc.id}">
            <div class="post-header">
              <span class="post-date">${date}</span>
              <button onclick="deletePost('${doc.id}')" class="delete-post-btn">×</button>
            </div>
            <div class="post-content">${post.content ? post.content.replace(/\n/g, '<br>') : ''}</div>
          </div>
        `;
      });
      
      postsContainer.innerHTML = postsHTML;
    }

    function listenForNewPosts() {
      if (unsubscribePosts) {
        unsubscribePosts();
      }
      
      // Слушаем только новые посты (последние 5 минут)
      const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000);
      
      unsubscribePosts = db.collection('posts')
        .where('userId', '==', currentUser.uid)
        .where('createdAt', '>', fiveMinutesAgo)
        .orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {
          if (!snapshot.empty) {
            // Обновляем только если есть новые посты
            const postsContainer = document.getElementById('postsContainer');
            if (postsContainer.children.length === 0 || 
                postsContainer.children[0].classList.contains('skeleton-post')) {
              // Если сейчас скелетоны, перезагружаем все
              loadPosts();
            } else {
              // Добавляем новые посты в начало
              snapshot.docChanges().forEach(change => {
                if (change.type === 'added') {
                  const post = change.doc.data();
                  let date = 'Только что';
                  if (post.createdAt) {
                    try {
                      date = new Date(post.createdAt.toDate()).toLocaleString();
                    } catch (e) {}
                  }
                  
                  const newPostHTML = `
                    <div class="post-card" id="post-${change.doc.id}" style="opacity: 0; transform: translateY(-20px); animation: slideIn 0.3s forwards;">
                      <div class="post-header">
                        <span class="post-date">${date}</span>
                        <button onclick="deletePost('${change.doc.id}')" class="delete-post-btn">×</button>
                      </div>
                      <div class="post-content">${post.content ? post.content.replace(/\n/g, '<br>') : ''}</div>
                    </div>
                  `;
                  postsContainer.insertAdjacentHTML('afterbegin', newPostHTML);
                }
              });
            }
          }
        });
    }

    let changes = {};

    function editNickname() {
      const span = document.getElementById('nickname');
      const current = span.textContent;
      span.innerHTML = `<input type="text" id="editNickname" value="${current}" class="edit-input">`;
      changes.nickname = true;
      
      if (!document.getElementById('saveProfileBtn')) {
        const saveBtn = document.createElement('button');
        saveBtn.id = 'saveProfileBtn';
        saveBtn.className = 'save-btn';
        saveBtn.textContent = 'Сохранить изменения';
        saveBtn.onclick = saveChanges;
        document.querySelector('.profile-info').appendChild(saveBtn);
      }
    }

    function editTag() {
      const span = document.getElementById('tag');
      const current = span.textContent;
      span.innerHTML = `<input type="text" id="editTag" value="${current}" placeholder="@tag" class="edit-input">`;
      changes.tag = true;
      
      if (!document.getElementById('saveProfileBtn')) {
        const saveBtn = document.createElement('button');
        saveBtn.id = 'saveProfileBtn';
        saveBtn.className = 'save-btn';
        saveBtn.textContent = 'Сохранить изменения';
        saveBtn.onclick = saveChanges;
        document.querySelector('.profile-info').appendChild(saveBtn);
      }
    }

    async function saveChanges() {
      const user = auth.currentUser;
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message';
      
      const updates = {};
      if (changes.nickname) updates.nickname = document.getElementById('editNickname').value;
      if (changes.tag) updates.tag = document.getElementById('editTag').value;
      
      try {
        await db.collection('users').doc(user.uid).update(updates);
        
        const newDisplayName = `${updates.nickname || currentUserData.nickname}|${updates.tag || currentUserData.tag}`;
        await user.updateProfile({ displayName: newDisplayName });
        
        // Обновляем кэш
        currentUserData = { ...currentUserData, ...updates };
        userCache.set(user.uid, currentUserData);
        
        messageDiv.innerHTML = '<div class="success">Изменения сохранены!</div>';
        document.querySelector('.profile-left').appendChild(messageDiv);
        
        document.getElementById('saveProfileBtn')?.remove();
        changes = {};
        
        setTimeout(() => messageDiv.remove(), 2000);
        
      } catch (error) {
        console.error('Ошибка сохранения:', error);
        messageDiv.innerHTML = '<div class="error">Ошибка при сохранении</div>';
        document.querySelector('.profile-left').appendChild(messageDiv);
        setTimeout(() => messageDiv.remove(), 2000);
      }
    }

    function showCreatePostModal() {
      document.getElementById('postModal').style.display = 'flex';
      document.getElementById('postContent').value = '';
    }

    function hideCreatePostModal() {
      document.getElementById('postModal').style.display = 'none';
    }

    async function createPost() {
  // Блокируем повторные нажатия
  if (isSubmitting) return;
  
  const content = document.getElementById('postContent').value.trim();
  
  if (!content) {
    alert('Введите текст поста');
    return;
  }
  
  // Скрываем модалку СРАЗУ
  hideCreatePostModal();
  
  // Блокируем кнопку
  isSubmitting = true;
  
  try {
    await db.collection('posts').add({
      userId: currentUser.uid,
      userNickname: currentUserData.nickname,
      userTag: currentUserData.tag,
      content: content,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Пост появится автоматически через слушатель listenForNewPosts()
    
  } catch (error) {
    console.error('Ошибка создания поста:', error);
    alert('Ошибка при создании поста');
  } finally {
    // Разблокируем кнопку через небольшую задержку
    setTimeout(() => {
      isSubmitting = false;
    }, 1000);
  }
}

    async function deletePost(postId) {
  if (!confirm('Удалить этот пост?')) return;
  
  try {
    await db.collection('posts').doc(postId).delete();
    // Пост удалится автоматически через слушатель listenForNewPosts()
  } catch (error) {
    console.error('Ошибка удаления поста:', error);
    alert('Ошибка при удалении поста');
  }
}

    function logout() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }

    window.onclick = function(event) {
      const modal = document.getElementById('postModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    };
  </script>
</body>
</html>
