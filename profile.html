<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <div id="profileContent">
      <!-- Содержимое будет заполнено через JavaScript -->
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // Проверяем авторизацию
    auth.onAuthStateChanged((user) => {
      const profileContent = document.getElementById('profileContent');
      
      if (user) {
        if (user.emailVerified) {
          // Email подтвержден - показываем приветствие
          const displayName = user.displayName || 'User';
          
          // Парсим ник и тег из displayName
          let nickname = displayName;
          let tag = '';
          
          const match = displayName.match(/(.+) \((@.+)\)/);
          if (match) {
            nickname = match[1];
            tag = match[2];
          }
          
          profileContent.innerHTML = `
            <h1>Профиль</h1>
            <div class="welcome-message">
              <h2>Hello, ${nickname} ${tag ? '(' + tag + ')' : ''}</h2>
              <p>Email: ${user.email} ✓</p>
            </div>
            <button onclick="logout()" class="logout-btn">Выйти из аккаунта</button>
          `;
        } else {
          // Email не подтвержден
          profileContent.innerHTML = `
            <h1>Подтверждение email</h1>
            <div class="warning">
              <h2>⚠️ Email не подтвержден</h2>
              <p>На почту <strong>${user.email}</strong> было отправлено письмо с подтверждением.</p>
              <p>Пожалуйста, перейдите по ссылке в письме, чтобы активировать аккаунт.</p>
              <button onclick="resendVerification()" class="resend-btn">
                Отправить письмо повторно
              </button>
              <button onclick="logout()" class="logout-btn" style="margin-top: 1rem; background-color: #666;">
                Выйти
              </button>
            </div>
          `;
        }
      } else {
        // Не авторизован
        window.location.href = 'index.html';
      }
    });
    
    async function resendVerification() {
      try {
        const user = auth.currentUser;
        if (user) {
          await user.sendEmailVerification({
            url: window.location.origin + '/profile.html'
          });
          alert('✅ Письмо отправлено! Проверьте почту (включая папку Спам)');
        }
      } catch (error) {
        alert('❌ Ошибка: ' + error.message);
      }
    }
    
    function logout() {
      auth.signOut()
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          alert('Ошибка: ' + error.message);
        });
    }
  </script>
</body>
</html>
