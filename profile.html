<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Профиль</h1>
    
    <div id="profileInfo" class="profile-info">
      <div class="loading">Загрузка данных...</div>
    </div>
    
    <div id="emailVerification" class="verification-message" style="display: none;">
      ⚠️ Ваш email не подтвержден. 
      <button onclick="sendVerificationEmail()">Отправить письмо повторно</button>
    </div>
    
    <button onclick="logout()" class="logout-btn">Выйти из аккаунта</button>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // Функция для загрузки данных профиля
    async function loadProfile(user) {
      try {
        // Получение дополнительных данных из Firestore
        const doc = await db.collection('users').doc(user.uid).get();
        
        if (doc.exists) {
          const userData = doc.data();
          
          // Обновляем информацию в профиле
          document.getElementById('profileInfo').innerHTML = `
            <div class="welcome-message">
              <h2>Hello, ${userData.nickname} (${userData.tag})</h2>
              <p>Email: ${userData.email} ${user.emailVerified ? '✓' : ''}</p>
            </div>
          `;
        } else {
          // Если данных нет в Firestore, используем данные из Auth
          document.getElementById('profileInfo').innerHTML = `
            <div class="welcome-message">
              <h2>Hello, User</h2>
              <p>Email: ${user.email}</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('Ошибка загрузки профиля:', error);
        document.getElementById('profileInfo').innerHTML = `
          <div class="error">Ошибка загрузки данных</div>
        `;
      }
    }

    // Проверка состояния аутентификации
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        // Пользователь вошел в систему
        
        // Проверка подтверждения email
        if (user.emailVerified) {
          document.getElementById('emailVerification').style.display = 'none';
          await loadProfile(user);
        } else {
          document.getElementById('emailVerification').style.display = 'block';
          document.getElementById('profileInfo').innerHTML = `
            <div class="info-message">
              <p>Пожалуйста, подтвердите ваш email, чтобы увидеть профиль</p>
            </div>
          `;
        }
      } else {
        // Пользователь не вошел - перенаправляем на страницу входа
        window.location.href = 'index.html';
      }
    });
    
    async function sendVerificationEmail() {
      try {
        const user = auth.currentUser;
        if (user) {
          await user.sendEmailVerification({
            url: window.location.origin + '/profile.html'
          });
          alert('✅ Письмо для подтверждения отправлено! Проверьте вашу почту.');
        }
      } catch (error) {
        alert('❌ Ошибка: ' + error.message);
      }
    }
    
    function logout() {
      auth.signOut()
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          alert('Ошибка при выходе: ' + error.message);
        });
    }
  </script>
</body>
</html>
