
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вход</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <h1>Вход</h1>
  <input id="email" type="email" placeholder="Введите email" /><br />
  <input id="password" type="password" placeholder="Введите пароль" /><br />
  <button id="loginBtn">Войти</button>
  <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>

  <script>
    // Вставь свою Firebase конфигурацию сюда
    const firebaseConfig = {
  apiKey: "AIzaSyAqzIbV2Uly03MbjpyNP9RQQx-0uDYnJdY",
  authDomain: "yttg-3b587.firebaseapp.com",
  projectId: "yttg-3b587",
  storageBucket: "yttg-3b587.firebasestorage.app",
  messagingSenderId: "77409665832",
  appId: "1:77409665832:web:b63c780592b3dfc82a061d",
  measurementId: "G-5VHQ23S2PP"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Проверка уже вошедшего пользователя
    auth.onAuthStateChanged(user => {
      if (user && user.emailVerified) {
        window.location.href = 'welcome.html';
      }
    });

    document.getElementById('loginBtn').onclick = () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.signInWithEmailAndPassword(email, password)
      .then(({user}) => {
        if (user.emailVerified) {
          window.location.href = 'welcome.html';
        } else {
          alert("Подтвердите почту, пожалуйста");
          auth.signOut();
        }
      })
      .catch(err => alert(err.message));
    };
  </script>
</body>
</html>
