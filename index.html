<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в аккаунт</title>
<!-- Для index.html (вход) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Вход в аккаунт</h1>
    
    <form id="loginForm">
      <div class="auth-input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      
      <div class="auth-input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      
      <div class="auth-links">
        <a href="forgot-password.html" class="forgot-password-link">Забыли пароль?</a>
      </div>
      
      <button type="submit" class="auth-button" id="loginBtn">Войти</button>
    </form>
    
    <div class="auth-footer">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="firebase-config.js"></script>
<script>
  // Проверяем, не залогинен ли уже пользователь
  auth.onAuthStateChanged((user) => {
    if (user && user.emailVerified) {
      // Если уже залогинен и email подтвержден - сразу кидаем в мессенджер
      window.location.href = 'messenger.html';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    const messageDiv = document.getElementById('message');
    
    loginBtn.disabled = true;
    loginBtn.textContent = 'Вход...';
    
    try {
      const userCredential = await auth.signInWithEmailAndPassword(email, password);
      const user = userCredential.user;
      
      if (user.emailVerified) {
        window.location.href = 'messenger.html';
      } else {
        messageDiv.innerHTML = `
          <div class="warning">
            <strong>ⓘ Аккаунт не активирован</strong>
            <p>На почту ${email} отправлено письмо с подтверждением.</p>
            <button onclick="resendVerification('${email}')" class="resend-btn">Отправить снова</button>
          </div>
        `;
        await auth.signOut();
      }
    } catch (error) {
      console.error('Ошибка входа:', error);
      
      let errorMessage = '';
      
      if (error.code === 'auth/network-request-failed') {
        errorMessage = '🌐 Проблема с интернетом. Проверьте подключение и попробуйте снова.';
      } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
        errorMessage = '❌ Неверный email или пароль';
      } else if (error.code === 'auth/too-many-requests') {
        errorMessage = '⏳ Слишком много попыток. Попробуйте позже.';
      } else if (error.code === 'auth/invalid-email') {
        errorMessage = '📧 Некорректный формат email';
      } else {
        errorMessage = '❌ Ошибка при входе. Попробуйте позже.';
      }
      
      messageDiv.innerHTML = `<div class="error">${errorMessage}</div>`;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Войти';
    }
  });

  // Функция для повторной отправки письма подтверждения
  window.resendVerification = async (email) => {
    try {
      await auth.sendSignInLinkToEmail(email, {
        url: window.location.origin + '/login.html',
        handleCodeInApp: true
      });
      document.getElementById('message').innerHTML = `
        <div class="success">✅ Письмо отправлено повторно!</div>
      `;
    } catch (error) {
      document.getElementById('message').innerHTML = `
        <div class="error">❌ Ошибка при отправке</div>
      `;
    }
  };
</script>
</body>
</html>
