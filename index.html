<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в аккаунт</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Вход в аккаунт</h1>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" required>
      </div>
      
      <button type="submit" id="loginBtn">Войти</button>
    </form>
    
    <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const messageDiv = document.getElementById('message');
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Вход...';
      messageDiv.innerHTML = '';
      
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        if (user.emailVerified) {
          // Email подтвержден - переходим в профиль
          window.location.href = 'profile.html';
        } else {
          // Email не подтвержден
          messageDiv.innerHTML = `
            <div class="warning">
              <p>⚠️ Email не подтвержден!</p>
              <p>Пожалуйста, подтвердите ваш email, перейдя по ссылке в письме.</p>
              <button onclick="resendVerification()" class="resend-btn">
                Отправить письмо повторно
              </button>
            </div>
          `;
          
          // Выходим из аккаунта
          await auth.signOut();
          
          loginBtn.disabled = false;
          loginBtn.textContent = 'Войти';
        }
      } catch (error) {
        console.error(error);
        
        let errorMessage = 'Неверный email или пароль';
        if (error.code === 'auth/user-not-found') {
          errorMessage = 'Пользователь с таким email не найден';
        } else if (error.code === 'auth/wrong-password') {
          errorMessage = 'Неверный пароль';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'Слишком много попыток. Попробуйте позже';
        }
        
        messageDiv.innerHTML = `<div class="error">❌ ${errorMessage}</div>`;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Войти';
      }
    });
    
    window.resendVerification = async () => {
      alert('Для повторной отправки письма, пожалуйста, зайдите на страницу регистрации и создайте аккаунт заново с тем же email');
    };
  </script>
</body>
</html>
