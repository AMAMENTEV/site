<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в аккаунт</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Вход в аккаунт</h1>
    
    <form id="loginForm">
      <div class="auth-input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      
      <div class="auth-input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="auth-button" id="loginBtn">Войти</button>
    </form>
    
    <div class="auth-footer">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const messageDiv = document.getElementById('message');
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Вход...';
      
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        if (user.emailVerified) {
          window.location.href = 'messenger.html';
        } else {
          messageDiv.innerHTML = `
            <div class="warning">
              <strong>ⓘ Аккаунт не активирован</strong>
              <p>На почту ${email} отправлено письмо с подтверждением.</p>
            </div>
          `;
          await auth.signOut();
        }
      } catch (error) {
        messageDiv.innerHTML = `<div class="error">❌ Неверный email или пароль</div>`;
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
