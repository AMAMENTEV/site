<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="messenger-container">
    <!-- Первая колонка - навигация (десктоп) -->
    <div class="nav-sidebar">
      <h2>Меню</h2>
      <div class="nav-buttons">
        <a href="profile.html" class="nav-button profile">Мой профиль</a>
        <button onclick="logout()" class="nav-button logout">Выйти</button>
      </div>
    </div>

    <!-- Вторая колонка - список пользователей -->
    <div class="users-sidebar" id="usersSidebar">
      <div class="users-header">
        <h2>Пользователи</h2>
        <p>Выберите кому написать</p>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по нику или тегу..." onkeyup="searchUsers()">
      </div>

      <div class="users-list" id="usersList">
        <div class="loading">Загрузка пользователей...</div>
      </div>
    </div>

    <!-- Третья колонка - чат -->
    <div class="chat-area" id="chatArea">
      <div class="chat-header" id="chatHeader">
        <div class="no-chat-selected" id="noChatMessage">Выберите пользователя для начала чата</div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="message-input-area" id="messageInputArea" style="display: none;">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" id="sendButton">→</button>
      </div>
    </div>
  </div>

  <!-- Мобильное меню (бургер) -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">☰</button>
  <div class="sidebar-overlay" id="mobileMenuOverlay" onclick="toggleMobileMenu()"></div>
  <div class="mobile-popup-menu" id="mobilePopupMenu">
    <a href="profile.html" class="popup-item">Мой профиль</a>
    <button onclick="logout()" class="popup-item logout">Выйти</button>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // ---------- Глобальные переменные ----------
    let currentUser = null;
    let currentUserData = null;
    let selectedUser = null;
    let currentChatId = null;
    let unsubscribeMessages = null;
    let allUsers = [];
    let isChatMode = false;
    
    // Объект для хранения количества непрочитанных сообщений по каждому пользователю
    let unreadCounts = {};

    // ---------- Проверка авторизации ----------
    auth.onAuthStateChanged(async (user) => {
      console.log('Auth state changed:', user ? user.email : 'no user');
      if (!user || !user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          currentUserData = userDoc.data();
        }
      } catch (error) {
        console.error('Ошибка загрузки пользователя:', error);
      }
      loadUsers();
    });

    // ---------- Загрузка списка пользователей ----------
    async function loadUsers() {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '<div class="loading">Загрузка пользователей...</div>';
      
      try {
        // 1. Получаем всех пользователей из Firestore
        const usersSnapshot = await db.collection('users').get();
        const allUsersMap = new Map();
        usersSnapshot.forEach(doc => {
          if (doc.id !== currentUser.uid) {
            allUsersMap.set(doc.id, { id: doc.id, ...doc.data() });
          }
        });

        // 2. Получаем все чаты текущего пользователя
        const chatsSnapshot = await db.collection('chats')
          .where('participants', 'array-contains', currentUser.uid)
          .get();

        // 3. Собираем ID пользователей и получаем непрочитанные сообщения
        const chatUserIds = new Set();
        const newUnreadCounts = {};
        
        // Сначала получаем время последнего сообщения для каждого чата
        const lastMessageTimes = {};
        
        for (const doc of chatsSnapshot.docs) {
          const chat = doc.data();
          const otherUserId = chat.participants.find(id => id !== currentUser.uid);
          if (otherUserId) {
            chatUserIds.add(otherUserId);
            
            // Сохраняем время последнего сообщения
            if (chat.lastMessageTime) {
              lastMessageTimes[otherUserId] = chat.lastMessageTime;
            }
            
            // Получаем количество непрочитанных сообщений в этом чате
            const messagesSnapshot = await db.collection('chats').doc(doc.id)
              .collection('messages')
              .where('read', '==', false)
              .where('receiverId', '==', currentUser.uid)
              .get();
            
            newUnreadCounts[otherUserId] = messagesSnapshot.size;
          }
        }
        
        unreadCounts = newUnreadCounts;

        // 4. Формируем список пользователей для отображения
        allUsers = []; // полный список для поиска
        const chatUsers = []; // только с чатами

        allUsersMap.forEach((user, id) => {
          allUsers.push(user);
          if (chatUserIds.has(id)) {
            chatUsers.push({
              ...user,
              lastMessageTime: lastMessageTimes[id] // добавляем время последнего сообщения
            });
          }
        });

        // 5. Сортируем пользователей: сначала с непрочитанными, потом по времени последнего сообщения, потом по алфавиту
        chatUsers.sort((a, b) => {
          const unreadA = unreadCounts[a.id] || 0;
          const unreadB = unreadCounts[b.id] || 0;
          
          // Сначала по количеству непрочитанных (от большего к меньшему)
          if (unreadB !== unreadA) {
            return unreadB - unreadA;
          }
          
          // Потом по времени последнего сообщения (от новых к старым)
          const timeA = a.lastMessageTime ? a.lastMessageTime.toDate?.() || new Date(a.lastMessageTime) : new Date(0);
          const timeB = b.lastMessageTime ? b.lastMessageTime.toDate?.() || new Date(b.lastMessageTime) : new Date(0);
          
          if (timeB - timeA !== 0) {
            return timeB - timeA;
          }
          
          // Потом по алфавиту
          return (a.nickname || '').localeCompare(b.nickname || '');
        });

        // 6. Отображаем пользователей с чатами
        if (chatUsers.length === 0) {
          usersList.innerHTML = '<div class="no-users">Нет активных чатов. Найдите пользователя через поиск.</div>';
        } else {
          displayUsers(chatUsers);
        }

        // Сохраняем полный список для поиска
        window.allUsers = allUsers;

        // Проверяем, есть ли параметр userId в URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('userId');

        if (targetUserId) {
          // Ищем пользователя в allUsers
          const targetUser = allUsers.find(u => u.id === targetUserId);
          if (targetUser) {
            setTimeout(() => {
              selectUser(targetUser.id, targetUser.nickname, targetUser.tag);
            }, 500);
          }
        }
        
      } catch (error) {
        console.error('Ошибка загрузки:', error);
        usersList.innerHTML = '<div class="error">Ошибка загрузки</div>';
      }
    }

auth.onAuthStateChanged(async (user) => {
  console.log('Auth state changed:', user ? user.email : 'no user');
  if (!user || !user.emailVerified) {
    window.location.href = 'index.html';
    return;
  }
  currentUser = user;
  try {
    const userDoc = await db.collection('users').doc(user.uid).get();
    if (userDoc.exists) {
      currentUserData = userDoc.data();
    }
  } catch (error) {
    console.error('Ошибка загрузки пользователя:', error);
  }
  loadUsers();
  
  // Запускаем глобальное прослушивание новых сообщений
  listenForNewMessages();
});

// ---------- Глобальное прослушивание новых сообщений ----------
function listenForNewMessages() {
  // Слушаем все чаты, где текущий пользователь - получатель
  db.collection('chats')
    .where('participants', 'array-contains', currentUser.uid)
    .onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === 'modified' || change.type === 'added') {
          // При любом изменении в чатах обновляем список пользователей
          console.log('Chat updated, refreshing users list');
          loadUsers();
        }
      });
    }, error => console.error('Ошибка прослушивания чатов:', error));
  
  // Также слушаем все непрочитанные сообщения
  db.collectionGroup('messages')
    .where('receiverId', '==', currentUser.uid)
    .where('read', '==', false)
    .onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') {
          // Если появилось новое непрочитанное сообщение
          console.log('New unread message received');
          loadUsers();
        }
      });
    }, error => console.error('Ошибка прослушивания сообщений:', error));
}

    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = users.map(user => {
        const firstLetter = user.nickname ? user.nickname.charAt(0).toUpperCase() : '?';
        const tag = user.tag || '';
        const nickname = user.nickname || 'Без имени';
        const unreadCount = unreadCounts[user.id] || 0;
        const unreadBadge = unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : '';
        
        return `
          <div class="user-item ${unreadCount > 0 ? 'has-unread' : ''}" onclick="selectUser('${user.id}', '${nickname.replace(/'/g, "\\'")}', '${tag.replace(/'/g, "\\'")}')">
            <div class="user-avatar-placeholder">${firstLetter}</div>
            <div class="user-info">
              <div class="user-name">${nickname} ${unreadBadge}</div>
              <div class="user-tag">${tag}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function searchUsers() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      
      if (!searchText) {
        // Если поиск пустой, показываем только пользователей с чатами
        loadUsers();
        return;
      }
      
      // Ищем по всем пользователям
      const filtered = window.allUsers.filter(user =>
        (user.nickname && user.nickname.toLowerCase().includes(searchText)) ||
        (user.tag && user.tag.toLowerCase().includes(searchText))
      );
      
      if (filtered.length === 0) {
        document.getElementById('usersList').innerHTML = '<div class="no-users">Ничего не найдено</div>';
      } else {
        // Для поиска показываем без учета непрочитанных, но сортируем по алфавиту
        filtered.sort((a, b) => (a.nickname || '').localeCompare(b.nickname || ''));
        
        // Временно создаем HTML с учетом непрочитанных
        const tempHTML = filtered.map(user => {
          const firstLetter = user.nickname ? user.nickname.charAt(0).toUpperCase() : '?';
          const tag = user.tag || '';
          const nickname = user.nickname || 'Без имени';
          const unreadCount = unreadCounts[user.id] || 0;
          const unreadBadge = unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : '';
          
          return `
            <div class="user-item ${unreadCount > 0 ? 'has-unread' : ''}" onclick="selectUser('${user.id}', '${nickname.replace(/'/g, "\\'")}', '${tag.replace(/'/g, "\\'")}')">
              <div class="user-avatar-placeholder">${firstLetter}</div>
              <div class="user-info">
                <div class="user-name">${nickname} ${unreadBadge}</div>
                <div class="user-tag">${tag}</div>
              </div>
            </div>
          `;
        }).join('');
        
        document.getElementById('usersList').innerHTML = tempHTML;
      }
    }

    // ---------- Выбор пользователя для чата ----------
    function selectUser(userId, nickname, tag) {
      selectedUser = { id: userId, nickname, tag };

      const chatHeader = document.getElementById('chatHeader');
      chatHeader.innerHTML = `
        <div class="selected-user" onclick="openUserProfile('${userId}')">
          <button class="mobile-back-btn" onclick="event.stopPropagation(); exitChatMode()"><</button>
          <div class="chat-user-avatar-placeholder">${nickname.charAt(0).toUpperCase()}</div>
          <div class="chat-user-info">
            <h3>${nickname}</h3>
            <p>${tag}</p>
          </div>
        </div>
      `;

      document.getElementById('messageInputArea').style.display = 'flex';

      if (window.innerWidth <= 768) {
        enterChatMode();
      }

      createOrGetChat();
      
      // Сбрасываем счетчик непрочитанных для этого пользователя
      if (unreadCounts[userId] > 0) {
        markMessagesAsRead(userId);
      }
    }

    // ---------- Отметить сообщения как прочитанные ----------
    async function markMessagesAsRead(userId) {
      if (!currentChatId) return;
      
      try {
        const unreadSnapshot = await db.collection('chats').doc(currentChatId)
          .collection('messages')
          .where('read', '==', false)
          .where('receiverId', '==', currentUser.uid)
          .get();
        
        const batch = db.batch();
        unreadSnapshot.forEach(doc => {
          batch.update(doc.ref, { read: true });
        });
        
        await batch.commit();
        
        // Обновляем счетчик
        unreadCounts[userId] = 0;
        
        // Обновляем отображение списка пользователей
        loadUsers();
        
      } catch (error) {
        console.error('Ошибка при отметке сообщений как прочитанных:', error);
      }
    }

    function openUserProfile(userId) {
      window.location.href = `user.html?id=${userId}`;
    }

    // ---------- Переключение режимов на мобилках ----------
    function enterChatMode() {
      isChatMode = true;
      document.body.classList.add('chat-mode');
      document.getElementById('mobileMenuBtn').style.display = 'none';
    }

    function exitChatMode() {
      isChatMode = false;
      document.body.classList.remove('chat-mode');
      document.getElementById('mobileMenuBtn').style.display = 'flex';

      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }
      selectedUser = null;
      currentChatId = null;
      document.getElementById('chatHeader').innerHTML = '<div class="no-chat-selected">Выберите пользователя для начала чата</div>';
      document.getElementById('messagesContainer').innerHTML = '';
      document.getElementById('messageInputArea').style.display = 'none';
    }

    // ---------- Создание/получение чата ----------
    async function createOrGetChat() {
      if (unsubscribeMessages) unsubscribeMessages();
      try {
        const chatsSnapshot = await db.collection('chats')
          .where('participants', 'array-contains', currentUser.uid)
          .get();
        let chatId = null;
        chatsSnapshot.forEach(doc => {
          const chat = doc.data();
          if (chat.participants.includes(selectedUser.id)) chatId = doc.id;
        });
        if (chatId) {
          currentChatId = chatId;
        } else {
          const newChat = await db.collection('chats').add({
            participants: [currentUser.uid, selectedUser.id],
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessage: null,
            lastMessageTime: null
          });
          currentChatId = newChat.id;
        }
        loadMessages();
      } catch (error) {
        console.error('Ошибка создания чата:', error);
      }
    }

// ---------- Загрузка сообщений ----------
function loadMessages() {
  if (!currentChatId) return;
  const messagesContainer = document.getElementById('messagesContainer');
  
  unsubscribeMessages = db.collection('chats').doc(currentChatId)
    .collection('messages')
    .orderBy('timestamp', 'asc')
    .onSnapshot(snapshot => {
      if (snapshot.empty) {
        messagesContainer.innerHTML = '<div class="no-messages">Нет сообщений. Напишите что-нибудь!</div>';
        return;
      }
      
      // Проверяем, есть ли новые сообщения от собеседника
      let hasNewMessageFromOther = false;
      let hasUnreadFromOther = false;
      
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') {
          const msg = change.doc.data();
          // Если сообщение от собеседника и оно новое (только что добавленное)
          if (msg.senderId === selectedUser.id) {
            hasNewMessageFromOther = true;
          }
        }
      });
      
      let html = '';
      snapshot.forEach(doc => {
        const msg = doc.data();
        const isMyMessage = msg.senderId === currentUser.uid;
        const time = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        
        // Если сообщение не от меня и не прочитано, помечаем как прочитанное
        if (!isMyMessage && !msg.read) {
          hasUnreadFromOther = true;
          // Отмечаем сообщение как прочитанное
          doc.ref.update({ read: true });
          
          // Обновляем счетчик непрочитанных для этого пользователя
          if (unreadCounts[selectedUser.id] > 0) {
            unreadCounts[selectedUser.id]--;
          }
        }
        
        html += `
          <div class="message ${isMyMessage ? 'my-message' : 'other-message'}">
            <div class="message-content">${msg.text}</div>
            <div class="message-time">${time}</div>
          </div>
        `;
      });
      
      messagesContainer.innerHTML = html;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      
      // Если есть новое сообщение от собеседника, обновляем список пользователей
      if (hasNewMessageFromOther) {
        console.log('New message from other, updating users list');
        loadUsers();
      } else if (hasUnreadFromOther) {
        // Если были непрочитанные сообщения, тоже обновляем список (для обновления счетчика)
        loadUsers();
      }
      
    }, error => console.error('Ошибка загрузки сообщений:', error));
}

    // ---------- Отправка сообщения ----------
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatId || !selectedUser) return;

      input.value = '';

      try {
        await db.collection('chats').doc(currentChatId)
          .collection('messages')
          .add({
            text: text,
            senderId: currentUser.uid,
            receiverId: selectedUser.id,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            read: false
          });
        await db.collection('chats').doc(currentChatId).update({
          lastMessage: text,
          lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Обновляем список пользователей у себя, чтобы этот чат поднялся наверх
        loadUsers();
        
      } catch (error) {
        console.error('Ошибка отправки:', error);
        alert('Ошибка при отправке сообщения');
        input.value = text;
      }
    }

    // ---------- Мобильное меню (бургер) ----------
    function toggleMobileMenu() {
      const menu = document.getElementById('mobilePopupMenu');
      const overlay = document.getElementById('mobileMenuOverlay');
      menu.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    // ---------- Выход ----------
    function logout() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }

    // ---------- Обработка resize и инициализация ----------
    window.addEventListener('load', function() {
      if (window.innerWidth <= 768) {
        document.body.classList.remove('chat-mode');
        document.getElementById('mobileMenuBtn').style.display = 'flex';
        document.getElementById('messageInputArea').style.display = 'none';
      }
    });

    window.addEventListener('resize', function() {
      if (window.innerWidth > 768) {
        document.body.classList.remove('chat-mode');
        document.getElementById('mobileMenuBtn').style.display = 'none';
      } else {
        document.getElementById('mobileMenuBtn').style.display = isChatMode ? 'none' : 'flex';
      }
    });
  </script>
</body>
</html>
