<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="messenger-container">
    <!-- Левая панель - список пользователей -->
    <div class="users-sidebar">
      <div class="sidebar-header">
        <h2>Пользователи</h2>
        <div class="header-actions">
          <a href="profile.html" class="profile-link">Мой профиль</a>
          <button onclick="logout()" class="logout-small">Выйти</button>
        </div>
      </div>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по нику или тегу..." onkeyup="searchUsers()">
      </div>
      
      <div class="users-list" id="usersList">
        <div class="loading">Загрузка пользователей...</div>
      </div>
    </div>
    
    <!-- Правая панель - чат -->
    <div class="chat-area">
      <div class="chat-header" id="chatHeader">
        <div class="no-chat-selected">Выберите пользователя для начала чата</div>
      </div>
      
      <div class="messages-container" id="messagesContainer">
        <!-- Сообщения будут здесь -->
      </div>
      
      <div class="message-input-area" id="messageInputArea" style="display: none;">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">→</button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    let currentUser = null;
    let selectedUser = null;
    let currentChatId = null;
    let unsubscribeMessages = null;
    let allUsers = [];
    
    // Проверка авторизации
    auth.onAuthStateChanged(async (user) => {
      console.log('Auth state changed:', user ? user.email : 'no user');
      
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      
      if (!user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      
      currentUser = user;
      loadUsers();
    });
    
    // Загрузка списка пользователей
    async function loadUsers() {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '<div class="loading">Загрузка пользователей...</div>';
      
      try {
        // Получаем всех пользователей кроме текущего
        const snapshot = await db.collection('users').get();
        console.log('Найдено документов:', snapshot.size);
        
        allUsers = [];
        
        snapshot.forEach(doc => {
          console.log('Документ:', doc.id, doc.data());
          if (doc.id !== currentUser.uid) {
            allUsers.push({
              id: doc.id,
              ...doc.data()
            });
          }
        });
        
        console.log('Пользователей кроме текущего:', allUsers.length);
        
        if (allUsers.length === 0) {
          usersList.innerHTML = '<div class="no-users">Пока нет других пользователей</div>';
        } else {
          displayUsers(allUsers);
        }
        
      } catch (error) {
        console.error('Ошибка загрузки пользователей:', error);
        usersList.innerHTML = '<div class="error">Ошибка загрузки пользователей</div>';
      }
    }
    
    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      
      // Сортируем по нику
      users.sort((a, b) => a.nickname.localeCompare(b.nickname));
      
      usersList.innerHTML = users.map(user => {
        // Берем первую букву ника для аватара
        const firstLetter = user.nickname ? user.nickname.charAt(0).toUpperCase() : '?';
        const tag = user.tag || '';
        const nickname = user.nickname || 'Без имени';
        
        return `
          <div class="user-item" onclick="selectUser('${user.id}', '${nickname.replace(/'/g, "\\'")}', '${tag.replace(/'/g, "\\'")}')">
            <div class="user-avatar-placeholder">${firstLetter}</div>
            <div class="user-info">
              <div class="user-name">${nickname}</div>
              <div class="user-tag">${tag}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    function searchUsers() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      
      if (!searchText) {
        displayUsers(allUsers);
        return;
      }
      
      const filtered = allUsers.filter(user => 
        (user.nickname && user.nickname.toLowerCase().includes(searchText)) || 
        (user.tag && user.tag.toLowerCase().includes(searchText))
      );
      
      displayUsers(filtered);
    }
    
    // Выбор пользователя для чата
    function selectUser(userId, nickname, tag) {
      selectedUser = { id: userId, nickname, tag };
      
      // Обновляем шапку чата
      document.getElementById('chatHeader').innerHTML = `
        <div class="selected-user" onclick="openUserProfile('${userId}')">
          <div class="chat-user-avatar-placeholder">${nickname.charAt(0).toUpperCase()}</div>
          <div class="chat-user-info">
            <div class="chat-user-name">${nickname}</div>
            <div class="chat-user-tag">${tag}</div>
          </div>
        </div>
      `;
      
      // Показываем поле ввода
      document.getElementById('messageInputArea').style.display = 'flex';
      
      // Создаем или получаем чат
      createOrGetChat();
    }
    
    // Создание или получение чата
    async function createOrGetChat() {
      // Отписываемся от предыдущего чата
      if (unsubscribeMessages) {
        unsubscribeMessages();
      }
      
      try {
        // Ищем существующий чат
        const chatsSnapshot = await db.collection('chats')
          .where('participants', 'array-contains', currentUser.uid)
          .get();
        
        let chatId = null;
        
        chatsSnapshot.forEach(doc => {
          const chat = doc.data();
          if (chat.participants.includes(selectedUser.id)) {
            chatId = doc.id;
          }
        });
        
        if (chatId) {
          currentChatId = chatId;
        } else {
          // Создаем новый чат
          const newChat = await db.collection('chats').add({
            participants: [currentUser.uid, selectedUser.id],
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessage: null,
            lastMessageTime: null
          });
          currentChatId = newChat.id;
        }
        
        // Загружаем сообщения
        loadMessages();
        
      } catch (error) {
        console.error('Ошибка создания чата:', error);
      }
    }
    
    // Загрузка сообщений
    function loadMessages() {
      const messagesContainer = document.getElementById('messagesContainer');
      
      if (!currentChatId) return;
      
      unsubscribeMessages = db.collection('chats').doc(currentChatId)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot((snapshot) => {
          if (snapshot.empty) {
            messagesContainer.innerHTML = '<div class="no-messages">Нет сообщений. Напишите что-нибудь!</div>';
            return;
          }
          
          let messagesHTML = '';
          snapshot.forEach(doc => {
            const msg = doc.data();
            const isMyMessage = msg.senderId === currentUser.uid;
            const time = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
            
            messagesHTML += `
              <div class="message ${isMyMessage ? 'my-message' : 'other-message'}">
                <div class="message-content">${msg.text}</div>
                <div class="message-time">${time}</div>
              </div>
            `;
          });
          
          messagesContainer.innerHTML = messagesHTML;
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, (error) => {
          console.error('Ошибка загрузки сообщений:', error);
          messagesContainer.innerHTML = '<div class="error">Ошибка загрузки сообщений</div>';
        });
    }
    
    // Отправка сообщения
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      
      if (!text || !currentChatId) return;
      
      try {
        await db.collection('chats').doc(currentChatId)
          .collection('messages')
          .add({
            text: text,
            senderId: currentUser.uid,
            receiverId: selectedUser.id,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        
        // Обновляем последнее сообщение в чате
        await db.collection('chats').doc(currentChatId).update({
          lastMessage: text,
          lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        input.value = '';
      } catch (error) {
        console.error('Ошибка отправки:', error);
        alert('Ошибка при отправке сообщения');
      }
    }
    
    // Открыть профиль пользователя
    function openUserProfile(userId) {
      window.location.href = `user.html?id=${userId}`;
    }
    
    // Выход из аккаунта
    function logout() {
      auth.signOut()
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          console.error('Ошибка при выходе:', error);
          alert('Ошибка при выходе из аккаунта');
        });
    }
  </script>
</body>
</html>
