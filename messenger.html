<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- Верхняя панель с кнопками -->
  <div class="top-bar">
    <div class="top-bar-left">
      <h1>Пользователи</h1>
    </div>
    <div class="top-bar-right">
      <a href="profile.html" class="top-bar-btn profile">Мой профиль</a>
      <button onclick="logout()" class="top-bar-btn logout">Выйти</button>
    </div>
  </div>

  <div class="messenger-container">
    <!-- Левая панель - список пользователей -->
    <div class="users-sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по нику или тегу..." onkeyup="searchUsers()">
      </div>
      
      <div class="users-list" id="usersList">
        <div class="loading">Загрузка пользователей...</div>
      </div>
    </div>
    
    <!-- Правая панель - чат -->
    <div class="chat-area">
      <div class="chat-header" id="chatHeader">
        <div class="no-chat-selected">Выберите пользователя для начала чата</div>
      </div>
      
      <div class="messages-container" id="messagesContainer">
        <!-- Сообщения будут здесь -->
      </div>
      
      <div class="message-input-area" id="messageInputArea" style="display: none;">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" id="sendButton">→</button>
      </div>
    </div>
  </div>

  <!-- Мобильное меню -->
  <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <script src="firebase-config.js"></script>
  <script>
    let currentUser = null;
    let currentUserData = null;
    let selectedUser = null;
    let currentChatId = null;
    let unsubscribeMessages = null;
    let allUsers = [];
    let pendingMessages = new Map(); // Для временных сообщений
    
    auth.onAuthStateChanged(async (user) => {
      if (!user || !user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      
      currentUser = user;
      
      const userDoc = await db.collection('users').doc(user.uid).get();
      if (userDoc.exists) {
        currentUserData = userDoc.data();
      }
      
      loadUsers();
    });
    
    async function loadUsers() {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '<div class="loading">Загрузка пользователей...</div>';
      
      try {
        const snapshot = await db.collection('users').get();
        
        allUsers = [];
        
        snapshot.forEach(doc => {
          if (doc.id !== currentUser.uid) {
            allUsers.push({
              id: doc.id,
              ...doc.data()
            });
          }
        });
        
        if (allUsers.length === 0) {
          usersList.innerHTML = '<div class="no-users">Пока нет других пользователей</div>';
        } else {
          displayUsers(allUsers);
        }
        
      } catch (error) {
        usersList.innerHTML = '<div class="error">Ошибка загрузки пользователей</div>';
      }
    }
    
    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      
      users.sort((a, b) => (a.nickname || '').localeCompare(b.nickname || ''));
      
      usersList.innerHTML = users.map(user => {
        const firstLetter = user.nickname ? user.nickname.charAt(0).toUpperCase() : '?';
        const tag = user.tag || '';
        const nickname = user.nickname || 'Без имени';
        
        return `
          <div class="user-item" onclick="selectUser('${user.id}', '${nickname.replace(/'/g, "\\'")}', '${tag.replace(/'/g, "\\'")}')">
            <div class="user-avatar-placeholder">${firstLetter}</div>
            <div class="user-info">
              <div class="user-name">${nickname}</div>
              <div class="user-tag">${tag}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    function searchUsers() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      
      if (!searchText) {
        displayUsers(allUsers);
        return;
      }
      
      const filtered = allUsers.filter(user => 
        (user.nickname && user.nickname.toLowerCase().includes(searchText)) || 
        (user.tag && user.tag.toLowerCase().includes(searchText))
      );
      
      displayUsers(filtered);
    }
    
    function selectUser(userId, nickname, tag) {
      selectedUser = { id: userId, nickname, tag };
      
      document.getElementById('chatHeader').innerHTML = `
        <div class="selected-user" onclick="openUserProfile('${userId}')">
          <div class="chat-user-avatar-placeholder">${nickname.charAt(0).toUpperCase()}</div>
          <div class="chat-user-info">
            <h3>${nickname}</h3>
            <p>${tag}</p>
          </div>
        </div>
      `;
      
      document.getElementById('messageInputArea').style.display = 'flex';
      createOrGetChat();
    }
    
    async function createOrGetChat() {
      if (unsubscribeMessages) {
        unsubscribeMessages();
      }
      
      try {
        const chatsSnapshot = await db.collection('chats')
          .where('participants', 'array-contains', currentUser.uid)
          .get();
        
        let chatId = null;
        
        chatsSnapshot.forEach(doc => {
          const chat = doc.data();
          if (chat.participants.includes(selectedUser.id)) {
            chatId = doc.id;
          }
        });
        
        if (chatId) {
          currentChatId = chatId;
        } else {
          const newChat = await db.collection('chats').add({
            participants: [currentUser.uid, selectedUser.id],
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessage: null,
            lastMessageTime: null
          });
          currentChatId = newChat.id;
        }
        
        loadMessages();
        
      } catch (error) {
        console.error('Ошибка создания чата:', error);
      }
    }
    
    function loadMessages() {
      const messagesContainer = document.getElementById('messagesContainer');
      
      if (!currentChatId) return;
      
      unsubscribeMessages = db.collection('chats').doc(currentChatId)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot((snapshot) => {
          // Объединяем реальные сообщения с ожидающими
          const realMessages = [];
          snapshot.forEach(doc => {
            const msg = doc.data();
            realMessages.push({
              id: doc.id,
              ...msg,
              timestamp: msg.timestamp?.toDate() || new Date()
            });
          });
          
          // Добавляем ожидающие сообщения
          const pendingForThisChat = Array.from(pendingMessages.values())
            .filter(msg => msg.chatId === currentChatId && msg.status === 'pending');
          
          const allMessages = [...realMessages, ...pendingForThisChat]
            .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          
          if (allMessages.length === 0) {
            messagesContainer.innerHTML = '<div class="no-messages">Нет сообщений. Напишите что-нибудь!</div>';
            return;
          }
          
          let messagesHTML = '';
          allMessages.forEach(msg => {
            const isMyMessage = msg.senderId === currentUser.uid;
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
            const statusClass = msg.status === 'pending' ? 'pending' : (msg.status === 'error' ? 'error' : '');
            
            messagesHTML += `
              <div class="message ${isMyMessage ? 'my-message' : 'other-message'} ${statusClass}">
                <div class="message-content">${msg.text}</div>
                <div class="message-time">
                  ${time}
                  ${msg.status === 'pending' ? '<span class="loading-indicator"></span>' : ''}
                </div>
              </div>
            `;
          });
          
          messagesContainer.innerHTML = messagesHTML;
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    }
    
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const sendButton = document.getElementById('sendButton');
      
      if (!text || !currentChatId) return;
      
      // Очищаем поле сразу
      input.value = '';
      
      // Создаем временное сообщение
      const tempId = 'temp_' + Date.now();
      const tempMessage = {
        id: tempId,
        text: text,
        senderId: currentUser.uid,
        receiverId: selectedUser.id,
        timestamp: new Date(),
        status: 'pending',
        chatId: currentChatId
      };
      
      // Добавляем в ожидающие
      pendingMessages.set(tempId, tempMessage);
      
      // Обновляем отображение
      const messagesContainer = document.getElementById('messagesContainer');
      // Триггерим обновление через snapshot
      
      try {
        // Отправляем в Firebase
        const docRef = await db.collection('chats').doc(currentChatId)
          .collection('messages')
          .add({
            text: text,
            senderId: currentUser.uid,
            receiverId: selectedUser.id,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        
        await db.collection('chats').doc(currentChatId).update({
          lastMessage: text,
          lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Удаляем из ожидающих после успешной отправки
        pendingMessages.delete(tempId);
        
      } catch (error) {
        console.error('Ошибка отправки:', error);
        
        // Помечаем сообщение как ошибочное
        if (pendingMessages.has(tempId)) {
          pendingMessages.get(tempId).status = 'error';
        }
        
        alert('Ошибка при отправке сообщения');
      }
    }
    
    function openUserProfile(userId) {
      window.location.href = `user.html?id=${userId}`;
    }
    
    function logout() {
      auth.signOut()
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          alert('Ошибка при выходе из аккаунта');
        });
    }
    
    function toggleSidebar() {
      document.querySelector('.users-sidebar').classList.toggle('active');
      document.querySelector('.sidebar-overlay').classList.toggle('active');
    }
  </script>
</body>
</html>
