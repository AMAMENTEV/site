<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="messenger-container">
    <!-- Первая колонка - навигация (десктоп) -->
    <div class="nav-sidebar">
      <h2>Меню</h2>
      <div class="nav-buttons">
        <a href="profile.html" class="nav-button profile">Мой профиль</a>
        <button onclick="showCreateGroupModal()" class="nav-button create-group">+ Беседа</button>
        <button onclick="logout()" class="nav-button logout">Выйти</button>
      </div>
    </div>

    <!-- Вторая колонка - список пользователей -->
    <div class="users-sidebar" id="usersSidebar">
      <div class="users-header">
        <h2>Пользователи</h2>
        <p>С кем есть чат</p>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по нику или тегу..." onkeyup="searchUsers()">
      </div>

      <div class="users-list" id="usersList">
        <div class="loading">Загрузка пользователей...</div>
      </div>
    </div>

    <!-- Третья колонка - чат -->
    <div class="chat-area" id="chatArea">
      <div class="chat-header" id="chatHeader">
        <div class="no-chat-selected" id="noChatMessage">Выберите пользователя для начала чата</div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="message-input-area" id="messageInputArea" style="display: none;">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" id="sendButton">→</button>
      </div>
    </div>
  </div>

  <!-- Мобильное меню (бургер) -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">☰</button>
  <div class="sidebar-overlay" id="mobileMenuOverlay" onclick="toggleMobileMenu()"></div>
  <div class="mobile-popup-menu" id="mobilePopupMenu">
    <a href="profile.html" class="popup-item">Мой профиль</a>
    <button onclick="showCreateGroupModal()" class="popup-item">+ Беседа</button>
    <button onclick="logout()" class="popup-item logout">Выйти</button>
  </div>

  <!-- Модальное окно для создания беседы -->
  <div id="createGroupModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Создать новую беседу</h3>
        <button onclick="hideCreateGroupModal()" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="groupName" placeholder="Название беседы" class="modal-input">
        <div class="group-participants">
          <h4>Выберите участников:</h4>
          <div id="usersListModal" class="users-checkbox-list">
            <!-- Список пользователей загрузится сюда -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="hideCreateGroupModal()" class="modal-cancel-btn">Отмена</button>
        <button onclick="createGroupChat()" class="modal-save-btn">Создать</button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // ---------- Глобальные переменные ----------
    let currentUser = null;
    let currentUserData = null;
    let selectedUser = null;
    let currentChatId = null;
    let unsubscribeMessages = null;
    let allUsers = [];
    let allUsersForModal = [];
    let isChatMode = false;
    
    // Объект для хранения количества непрочитанных сообщений по каждому пользователю
    let unreadCounts = {};

    // ---------- Проверка авторизации ----------
    auth.onAuthStateChanged(async (user) => {
      console.log('Auth state changed:', user ? user.email : 'no user');
      if (!user || !user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          currentUserData = userDoc.data();
        }
      } catch (error) {
        console.error('Ошибка загрузки пользователя:', error);
      }
      loadUsers();
      loadAllUsersForModal();
      
      // Запускаем глобальное прослушивание новых сообщений
      listenForNewMessages();
    });

    // ---------- Загрузка всех пользователей для создания бесед ----------
    async function loadAllUsersForModal() {
      try {
        const snapshot = await db.collection('users').get();
        allUsersForModal = [];
        snapshot.forEach(doc => {
          if (doc.id !== currentUser.uid) {
            allUsersForModal.push({ id: doc.id, ...doc.data() });
          }
        });
      } catch (error) {
        console.error('Ошибка загрузки пользователей:', error);
      }
    }

    // ---------- Загрузка списка пользователей ----------
    async function loadUsers() {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '<div class="loading">Загрузка пользователей...</div>';
      
      try {
        // 1. Получаем всех пользователей из Firestore
        const usersSnapshot = await db.collection('users').get();
        const allUsersMap = new Map();
        usersSnapshot.forEach(doc => {
          if (doc.id !== currentUser.uid) {
            allUsersMap.set(doc.id, { id: doc.id, ...doc.data() });
          }
        });

        // 2. Получаем все чаты текущего пользователя
        const chatsSnapshot = await db.collection('chats')
          .where('participants', 'array-contains', currentUser.uid)
          .get();

        // 3. Собираем ID пользователей, с которыми есть чаты
        const chatUserIds = new Set();
        const chatIds = new Map(); // для хранения id чата для каждого пользователя
        
        for (const doc of chatsSnapshot.docs) {
          const chat = doc.data();
          if (!chat.isGroup) {
            // Только личные чаты
            const otherUserId = chat.participants.find(id => id !== currentUser.uid);
            if (otherUserId) {
              chatUserIds.add(otherUserId);
              chatIds.set(otherUserId, doc.id);
            }
          }
        }

        // 4. Формируем список пользователей для отображения
        allUsers = [];
        const chatUsers = [];

        allUsersMap.forEach((user, id) => {
          allUsers.push(user);
          if (chatUserIds.has(id)) {
            chatUsers.push({
              ...user,
              chatId: chatIds.get(id)
            });
          }
        });

        // 5. Сортируем пользователей по алфавиту
        chatUsers.sort((a, b) => (a.nickname || '').localeCompare(b.nickname || ''));

        // 6. Отображаем пользователей с чатами
        if (chatUsers.length === 0) {
          usersList.innerHTML = '<div class="no-users">Нет активных чатов. Создайте беседу или найдите пользователя через поиск.</div>';
        } else {
          displayUsers(chatUsers);
        }

        // Сохраняем полный список для поиска
        window.allUsers = allUsers;

        // Проверяем, есть ли параметр userId в URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('userId');

        if (targetUserId) {
          // Ищем пользователя в allUsers
          const targetUser = allUsers.find(u => u.id === targetUserId);
          if (targetUser) {
            setTimeout(() => {
              selectUser(targetUser.id, targetUser.nickname, targetUser.tag, chatIds.get(targetUserId));
              const newUrl = window.location.pathname;
              window.history.replaceState({}, document.title, newUrl);
            }, 500);
          }
        }
        
      } catch (error) {
        console.error('Ошибка загрузки:', error);
        usersList.innerHTML = '<div class="error">Ошибка загрузки</div>';
      }
    }

    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      
      usersList.innerHTML = users.map(user => {
        const firstLetter = user.nickname ? user.nickname.charAt(0).toUpperCase() : '?';
        const tag = user.tag || '';
        const nickname = user.nickname || 'Без имени';
        const unreadCount = unreadCounts[user.id] || 0;
        const unreadBadge = unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : '';
        
        return `
          <div class="user-item ${unreadCount > 0 ? 'has-unread' : ''}" onclick="selectUser('${user.id}', '${nickname.replace(/'/g, "\\'")}', '${tag.replace(/'/g, "\\'")}', '${user.chatId}')">
            <div class="user-avatar-placeholder">${firstLetter}</div>
            <div class="user-info">
              <div class="user-name">${nickname} ${unreadBadge}</div>
              <div class="user-tag">${tag}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function searchUsers() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      
      if (!searchText) {
        loadUsers();
        return;
      }
      
      // Ищем по всем пользователям
      const filtered = window.allUsers.filter(user =>
        (user.nickname && user.nickname.toLowerCase().includes(searchText)) ||
        (user.tag && user.tag.toLowerCase().includes(searchText))
      );
      
      if (filtered.length === 0) {
        document.getElementById('usersList').innerHTML = '<div class="no-users">Ничего не найдено</div>';
      } else {
        // Для поиска показываем всех найденных, но сортируем по алфавиту
        filtered.sort((a, b) => (a.nickname || '').localeCompare(b.nickname || ''));
        
        const tempHTML = filtered.map(user => {
          const firstLetter = user.nickname ? user.nickname.charAt(0).toUpperCase() : '?';
          const tag = user.tag || '';
          const nickname = user.nickname || 'Без имени';
          
          return `
            <div class="user-item" onclick="createPrivateChat('${user.id}', '${nickname.replace(/'/g, "\\'")}', '${tag.replace(/'/g, "\\'")}')">
              <div class="user-avatar-placeholder">${firstLetter}</div>
              <div class="user-info">
                <div class="user-name">${nickname}</div>
                <div class="user-tag">${tag}</div>
              </div>
            </div>
          `;
        }).join('');
        
        document.getElementById('usersList').innerHTML = tempHTML;
      }
    }

    // ---------- Создание личного чата с новым пользователем ----------
    async function createPrivateChat(userId, nickname, tag) {
      try {
        // Проверяем, есть ли уже чат
        const chatsSnapshot = await db.collection('chats')
          .where('participants', 'array-contains', currentUser.uid)
          .get();
        
        let existingChatId = null;
        chatsSnapshot.forEach(doc => {
          const chat = doc.data();
          if (!chat.isGroup && chat.participants.includes(userId)) {
            existingChatId = doc.id;
          }
        });
        
        if (existingChatId) {
          // Чат уже существует
          selectUser(userId, nickname, tag, existingChatId);
        } else {
          // Создаем новый чат
          const newChat = await db.collection('chats').add({
            participants: [currentUser.uid, userId],
            isGroup: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessage: null,
            lastMessageTime: null
          });
          selectUser(userId, nickname, tag, newChat.id);
        }
      } catch (error) {
        console.error('Ошибка создания чата:', error);
        alert('Ошибка при создании чата');
      }
    }

    // ---------- Выбор пользователя для чата ----------
    function selectUser(userId, nickname, tag, chatId) {
      selectedUser = { id: userId, nickname, tag, chatId };
      currentChatId = chatId;

      const chatHeader = document.getElementById('chatHeader');
      chatHeader.innerHTML = `
        <div class="selected-user" onclick="openUserProfile('${userId}')">
          <button class="mobile-back-btn" onclick="event.stopPropagation(); exitChatMode()"><</button>
          <div class="chat-user-avatar-placeholder">${nickname.charAt(0).toUpperCase()}</div>
          <div class="chat-user-info">
            <h3>${nickname}</h3>
            <p>${tag}</p>
          </div>
        </div>
      `;

      document.getElementById('messageInputArea').style.display = 'flex';

      if (window.innerWidth <= 768) {
        enterChatMode();
      }

      loadMessages();
      
      // Сбрасываем счетчик непрочитанных для этого пользователя
      if (unreadCounts[userId] > 0) {
        markMessagesAsRead(userId);
      }
    }

    // ---------- Отметить сообщения как прочитанные ----------
    async function markMessagesAsRead(userId) {
      if (!currentChatId) return;
      
      try {
        const unreadSnapshot = await db.collection('chats').doc(currentChatId)
          .collection('messages')
          .where('read', '==', false)
          .where('receiverId', '==', currentUser.uid)
          .get();
        
        const batch = db.batch();
        unreadSnapshot.forEach(doc => {
          batch.update(doc.ref, { read: true });
        });
        
        await batch.commit();
        
        // Обновляем счетчик
        unreadCounts[userId] = 0;
        
        // Обновляем отображение списка пользователей
        loadUsers();
        
      } catch (error) {
        console.error('Ошибка при отметке сообщений как прочитанных:', error);
      }
    }

    function openUserProfile(userId) {
      window.location.href = `user.html?id=${userId}`;
    }

    // ---------- Переключение режимов на мобилках ----------
    function enterChatMode() {
      isChatMode = true;
      document.body.classList.add('chat-mode');
      document.getElementById('mobileMenuBtn').style.display = 'none';
    }

    function exitChatMode() {
      isChatMode = false;
      document.body.classList.remove('chat-mode');
      document.getElementById('mobileMenuBtn').style.display = 'flex';

      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }
      selectedUser = null;
      currentChatId = null;
      document.getElementById('chatHeader').innerHTML = '<div class="no-chat-selected">Выберите пользователя для начала чата</div>';
      document.getElementById('messagesContainer').innerHTML = '';
      document.getElementById('messageInputArea').style.display = 'none';
    }

    // ---------- Создание/получение чата ----------
    async function createOrGetChat() {
      if (unsubscribeMessages) unsubscribeMessages();
      try {
        const chatsSnapshot = await db.collection('chats')
          .where('participants', 'array-contains', currentUser.uid)
          .get();
        let chatId = null;
        chatsSnapshot.forEach(doc => {
          const chat = doc.data();
          if (chat.participants.includes(selectedUser.id)) chatId = doc.id;
        });
        if (chatId) {
          currentChatId = chatId;
        } else {
          const newChat = await db.collection('chats').add({
            participants: [currentUser.uid, selectedUser.id],
            isGroup: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessage: null,
            lastMessageTime: null
          });
          currentChatId = newChat.id;
        }
        loadMessages();
      } catch (error) {
        console.error('Ошибка создания чата:', error);
      }
    }

    // ---------- Загрузка сообщений ----------
    function loadMessages() {
      if (!currentChatId) return;
      const messagesContainer = document.getElementById('messagesContainer');
      
      if (unsubscribeMessages) {
        unsubscribeMessages();
      }
      
      unsubscribeMessages = db.collection('chats').doc(currentChatId)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
          if (snapshot.empty) {
            messagesContainer.innerHTML = '<div class="no-messages">Нет сообщений. Напишите что-нибудь!</div>';
            return;
          }
          
          // Проверяем, есть ли новые сообщения от собеседника
          let hasNewMessageFromOther = false;
          
          snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
              const msg = change.doc.data();
              if (msg.senderId !== currentUser.uid) {
                hasNewMessageFromOther = true;
              }
            }
          });
          
          let html = '';
          snapshot.forEach(doc => {
            const msg = doc.data();
            const isMyMessage = msg.senderId === currentUser.uid;
            const time = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            
            // Если сообщение не от меня и не прочитано, помечаем как прочитанное
            if (!isMyMessage && !msg.read) {
              doc.ref.update({ read: true });
            }
            
            html += `
              <div class="message ${isMyMessage ? 'my-message' : 'other-message'}">
                <div class="message-content">${msg.text}</div>
                <div class="message-time">${time}</div>
              </div>
            `;
          });
          
          messagesContainer.innerHTML = html;
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
          
          // Если есть новое сообщение от собеседника, обновляем список пользователей
          if (hasNewMessageFromOther) {
            loadUsers();
          }
          
        }, error => console.error('Ошибка загрузки сообщений:', error));
    }

    // ---------- Отправка сообщения ----------
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatId || !selectedUser) return;

      input.value = '';

      try {
        await db.collection('chats').doc(currentChatId)
          .collection('messages')
          .add({
            text: text,
            senderId: currentUser.uid,
            receiverId: selectedUser.id,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            read: false
          });
          
        await db.collection('chats').doc(currentChatId).update({
          lastMessage: text,
          lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Обновляем список пользователей
        loadUsers();
        
      } catch (error) {
        console.error('Ошибка отправки:', error);
        alert('Ошибка при отправке сообщения');
        input.value = text;
      }
    }

    // ---------- Глобальное прослушивание новых сообщений ----------
    function listenForNewMessages() {
      db.collection('chats')
        .where('participants', 'array-contains', currentUser.uid)
        .onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
            if (change.type === 'modified' || change.type === 'added') {
              console.log('Chat updated, refreshing users list');
              loadUsers();
            }
          });
        }, error => console.error('Ошибка прослушивания чатов:', error));
      
      db.collectionGroup('messages')
        .where('receiverId', '==', currentUser.uid)
        .where('read', '==', false)
        .onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
              console.log('New unread message received');
              loadUsers();
            }
          });
        }, error => console.error('Ошибка прослушивания сообщений:', error));
    }

    // ---------- Создание группового чата ----------
    function showCreateGroupModal() {
      const usersList = document.getElementById('usersListModal');
      if (!usersList) return;
      
      if (allUsersForModal.length === 0) {
        usersList.innerHTML = '<div class="no-users">Загрузка пользователей...</div>';
        loadAllUsersForModal().then(() => {
          displayUsersInModal();
        });
      } else {
        displayUsersInModal();
      }
      
      document.getElementById('createGroupModal').style.display = 'flex';
    }
    
    function displayUsersInModal() {
      const usersList = document.getElementById('usersListModal');
      if (allUsersForModal.length === 0) {
        usersList.innerHTML = '<div class="no-users">Нет других пользователей</div>';
        return;
      }
      
      let html = '';
      allUsersForModal.forEach(user => {
        html += `
          <label class="user-checkbox">
            <input type="checkbox" value="${user.id}">
            <span>${user.nickname} ${user.tag}</span>
          </label>
        `;
      });
      usersList.innerHTML = html;
    }

    function hideCreateGroupModal() {
      document.getElementById('createGroupModal').style.display = 'none';
    }

    async function createGroupChat() {
      const groupName = document.getElementById('groupName').value.trim();
      const checkboxes = document.querySelectorAll('#usersListModal input[type="checkbox"]:checked');
      
      if (!groupName) {
        alert('Введите название беседы');
        return;
      }
      
      if (checkboxes.length === 0) {
        alert('Выберите хотя бы одного участника');
        return;
      }
      
      const participants = [currentUser.uid];
      checkboxes.forEach(cb => participants.push(cb.value));
      
      try {
        await db.collection('chats').add({
          name: groupName,
          participants: participants,
          isGroup: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastMessage: null,
          lastMessageTime: null
        });
        
        hideCreateGroupModal();
        document.getElementById('groupName').value = '';
        alert('Беседа успешно создана!');
        
      } catch (error) {
        console.error('Ошибка создания беседы:', error);
        alert('Ошибка при создании беседы: ' + error.message);
      }
    }

    // ---------- Мобильное меню (бургер) ----------
    function toggleMobileMenu() {
      const menu = document.getElementById('mobilePopupMenu');
      const overlay = document.getElementById('mobileMenuOverlay');
      menu.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    function logout() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }

    // ---------- Обработка resize и инициализация ----------
    window.addEventListener('load', function() {
      if (window.innerWidth <= 768) {
        document.body.classList.remove('chat-mode');
        document.getElementById('mobileMenuBtn').style.display = 'flex';
        document.getElementById('messageInputArea').style.display = 'none';
      }
    });

    window.addEventListener('resize', function() {
      if (window.innerWidth > 768) {
        document.body.classList.remove('chat-mode');
        document.getElementById('mobileMenuBtn').style.display = 'none';
      } else {
        document.getElementById('mobileMenuBtn').style.display = isChatMode ? 'none' : 'flex';
      }
    });
  </script>
</body>
</html>
