<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль пользователя</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <a href="messenger.html" class="back-btn" id="backButton"><</a>
    </div>
    
    <div class="profile-two-columns" id="profileContent">
      <div class="loading">Загрузка профиля...</div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // Получаем ID пользователя из URL
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');
    
    if (!userId) {
      window.location.href = 'messenger.html';
    }

    // Обновляем ссылку "назад" с userId
    document.getElementById('backButton').href = `messenger.html?userId=${userId}`;

    let currentUser = null;
    let unsubscribePosts = null;

    auth.onAuthStateChanged(async (user) => {
      if (!user || !user.emailVerified) {
        window.location.href = 'index.html';
        return;
      }
      
      currentUser = user;
      
      try {
        // Загружаем информацию о пользователе
        const userDoc = await db.collection('users').doc(userId).get();
        
        if (!userDoc.exists) {
          document.getElementById('profileContent').innerHTML = `
            <div class="error">Пользователь не найден</div>
            <a href="messenger.html" style="display: block; text-align: center; margin-top: 20px; color: #667eea;">Вернуться в мессенджер</a>
          `;
          return;
        }
        
        const userData = userDoc.data();
        const firstLetter = userData.nickname.charAt(0).toUpperCase();
        
        // Отображаем профиль
        document.getElementById('profileContent').innerHTML = `
          <!-- Левая колонка - информация о пользователе -->
          <div class="profile-left">
            <div class="profile-card">
              <div class="profile-avatar-placeholder">
                <div class="avatar-large">${firstLetter}</div>
              </div>
              
              <div class="profile-info">
                <div class="info-row">
                  <label>Никнейм:</label>
                  <span>${userData.nickname}</span>
                </div>
                
                <div class="info-row">
                  <label>Тег:</label>
                  <span>${userData.tag}</span>
                </div>
              </div>
              
              <button onclick="startChat()" class="chat-btn">Написать сообщение</button>
            </div>
          </div>
          
          <!-- Правая колонка - посты -->
          <div class="profile-right">
            <div class="posts-header">
              <h2>Посты пользователя</h2>
            </div>
            
            <div class="posts-container" id="postsContainer">
              <div class="loading">Загрузка постов...</div>
            </div>
          </div>
        `;
        
        // Загружаем посты
        loadPosts(userId);
        
      } catch (error) {
        console.error('Ошибка загрузки профиля:', error);
        document.getElementById('profileContent').innerHTML = '<div class="error">Ошибка загрузки профиля</div>';
      }
    });

    async function loadPosts(targetUserId) {
      const postsContainer = document.getElementById('postsContainer');
      
      // Отписываемся от предыдущего слушателя
      if (unsubscribePosts) {
        unsubscribePosts();
      }
      
      try {
        // Слушаем изменения в постах в реальном времени
        unsubscribePosts = db.collection('posts')
          .where('userId', '==', targetUserId)
          .orderBy('createdAt', 'desc')
          .onSnapshot(snapshot => {
            if (snapshot.empty) {
              postsContainer.innerHTML = '<div class="no-posts">У пользователя пока нет постов</div>';
              return;
            }
            
            let postsHTML = '';
            snapshot.forEach(doc => {
              const post = doc.data();
              const date = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : '';
              
              postsHTML += `
                <div class="post-card">
                  <div class="post-header">
                    <span class="post-date">${date}</span>
                  </div>
                  <div class="post-content">${post.content.replace(/\n/g, '<br>')}</div>
                </div>
              `;
            });
            
            postsContainer.innerHTML = postsHTML;
          }, error => {
            console.error('Ошибка загрузки постов:', error);
            postsContainer.innerHTML = '<div class="error">Ошибка загрузки постов</div>';
          });
          
      } catch (error) {
        console.error('Ошибка:', error);
        postsContainer.innerHTML = '<div class="error">Ошибка загрузки постов</div>';
      }
    }

    function startChat() {
      window.location.href = `messenger.html?userId=${userId}`;
    }
  </script>
</body>
</html>
