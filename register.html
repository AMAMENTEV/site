<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Регистрация</h1>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="nickname">Никнейм:</label>
        <input type="text" id="nickname" required>
      </div>
      
      <div class="form-group">
        <label for="tag">Тег (@):</label>
        <input type="text" id="tag" pattern="@[A-Za-z0-9_]+" placeholder="@username" required>
        <small>Только латинские буквы, цифры и нижнее подчеркивание</small>
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" required minlength="6">
        <small>Минимум 6 символов</small>
      </div>
      
      <button type="submit" id="registerBtn">Зарегистрироваться</button>
    </form>
    
    <p>Уже есть аккаунт? <a href="index.html">Войти</a></p>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nickname = document.getElementById('nickname').value;
      const tag = document.getElementById('tag').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Блокируем кнопку, чтобы избежать повторной отправки
      const registerBtn = document.getElementById('registerBtn');
      registerBtn.disabled = true;
      registerBtn.textContent = 'Регистрация...';
      
      try {
        // Создание пользователя в Firebase Auth
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Сохранение дополнительной информации в Firestore
        await db.collection('users').doc(user.uid).set({
          nickname: nickname,
          tag: tag,
          email: email,
          emailVerified: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Отправка письма для подтверждения email
        await user.sendEmailVerification({
          url: window.location.origin + '/index.html'
        });
        
        // Показываем сообщение об успехе
        document.getElementById('message').innerHTML = `
          <div class="success">
            ✅ Регистрация успешна!<br><br>
            На ваш email <strong>${email}</strong> отправлено письмо с подтверждением.<br><br>
            Пожалуйста, подтвердите email и войдите в аккаунт.<br><br>
            <small>Перенаправление на страницу входа через 5 секунд...</small>
          </div>
        `;
        
        // Выходим из аккаунта, чтобы пользователь не был автоматически авторизован
        await auth.signOut();
        
        // Перенаправление на страницу входа через 5 секунд
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 5000);
        
      } catch (error) {
        console.error('Ошибка регистрации:', error);
        
        let errorMessage = error.message;
        if (error.code === 'auth/email-already-in-use') {
          errorMessage = 'Этот email уже зарегистрирован';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Некорректный email';
        } else if (error.code === 'auth/weak-password') {
          errorMessage = 'Пароль должен быть минимум 6 символов';
        }
        
        document.getElementById('message').innerHTML = `
          <div class="error">❌ ${errorMessage}</div>
        `;
        
        // Разблокируем кнопку
        registerBtn.disabled = false;
        registerBtn.textContent = 'Зарегистрироваться';
      }
    });
  </script>
</body>
</html>
