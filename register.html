<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Регистрация</h1>
    <p class="auth-subtitle">Создайте аккаунт чтобы начать общение</p>
    
    <form id="registerForm">
      <div class="auth-input-group">
        <label>Никнейм</label>
        <input type="text" id="nickname" placeholder="Например: Anna" required>
      </div>
      
      <div class="auth-input-group">
        <label>Тег</label>
        <input type="text" id="tag" placeholder="@username" required>
      </div>
      
      <div class="auth-input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      
      <div class="auth-input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Минимум 6 символов" required minlength="6">
      </div>
      
      <button type="submit" class="auth-button" id="registerBtn">Зарегистрироваться</button>
    </form>
    
    <div class="auth-footer">
      Уже есть аккаунт? <a href="index.html">Войти</a>
    </div>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nickname = document.getElementById('nickname').value;
      const tag = document.getElementById('tag').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const registerBtn = document.getElementById('registerBtn');
      const messageDiv = document.getElementById('message');
      
      registerBtn.disabled = true;
      registerBtn.textContent = 'Регистрация...';
      
      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        await user.updateProfile({
          displayName: nickname + '|' + tag
        });
        
        await db.collection('users').doc(user.uid).set({
          nickname: nickname,
          tag: tag,
          email: email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        await user.sendEmailVerification();
        await auth.signOut();
        
messageDiv.innerHTML = `
  <div class="success">
    <h3>✅ Регистрация успешна!</h3>
    <p>На почту ${email} отправлено письмо с подтверждением.</p>
    <p><a href="index.html" style="color: #667eea;">Перейти ко входу →</a></p>
  </div>
`;
        
        document.getElementById('registerForm').style.display = 'none';
        
      } catch (error) {
  console.error('Ошибка регистрации:', error);
  
  registerBtn.disabled = false;
  registerBtn.textContent = 'Зарегистрироваться';
  
  let errorMessage = '';
  
  if (error.code === 'auth/network-request-failed') {
    errorMessage = '🌐 Проблема с интернетом. Проверьте подключение и попробуйте снова.';
  } else if (error.code === 'auth/email-already-in-use') {
    errorMessage = 'Этот email уже зарегистрирован';
  } else if (error.code === 'auth/invalid-email') {
    errorMessage = 'Некорректный email';
  } else if (error.code === 'auth/weak-password') {
    errorMessage = 'Пароль должен быть минимум 6 символов';
  } else {
    errorMessage = 'Ошибка при регистрации. Попробуйте позже.';
  }
  
  messageDiv.innerHTML = `<div class="error">❌ ${errorMessage}</div>`;
}
    });
  </script>
</body>
</html>
