<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
<!-- Для register.html -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <style>
    /* Стиль для поля ввода тега */
    .tag-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .tag-input-wrapper span {
      position: absolute;
      left: 14px;
      color: #666;
      font-size: 1rem;
      pointer-events: none;
      z-index: 1;
    }
    
    .tag-input-wrapper input {
      padding-left: 30px !important;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Регистрация</h1>
    <p class="auth-subtitle">Создайте аккаунт чтобы начать общение</p>
    
    <form id="registerForm">
      <div class="auth-input-group">
        <label>Никнейм</label>
        <input type="text" id="nickname" placeholder="Например: Anna" required>
      </div>
      
      <div class="auth-input-group">
        <label>Тег</label>
        <div class="tag-input-wrapper">
          <span>@</span>
          <input type="text" id="tag" placeholder="username" required 
                 oninput="handleTagInput(this)" 
                 onkeydown="preventAtSymbolDeletion(event, this)">
        </div>
      </div>
      
      <div class="auth-input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      
      <div class="auth-input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Минимум 6 символов" required minlength="6">
      </div>
      
      <button type="submit" class="auth-button" id="registerBtn">Зарегистрироваться</button>
    </form>
    
    <div class="auth-footer">
      Уже есть аккаунт? <a href="index.html">Войти</a>
    </div>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    // Функция для обработки ввода тега
    function handleTagInput(input) {
      let value = input.value;
      
      // Удаляем все @ из значения (оставляем только то, что после @)
      value = value.replace(/@/g, '');
      
      // Обновляем значение без @
      input.value = value;
    }
    
    // Функция для предотвращения удаления @
    function preventAtSymbolDeletion(event, input) {
      // Если нажата backspace и курсор в самом начале
      if (event.key === 'Backspace' && input.selectionStart === 0 && input.selectionEnd === 0) {
        event.preventDefault();
      }
      
      // Если нажата delete и выделен первый символ
      if (event.key === 'Delete' && input.selectionStart === 0 && input.selectionEnd === 1) {
        event.preventDefault();
      }
      
      // Запрещаем перемещение курсора левее позиции 0
      if (event.key === 'ArrowLeft' && input.selectionStart === 0 && input.selectionEnd === 0) {
        event.preventDefault();
      }
    }
    
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nickname = document.getElementById('nickname').value;
      let tag = document.getElementById('tag').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const registerBtn = document.getElementById('registerBtn');
      const messageDiv = document.getElementById('message');
      
      // Добавляем @ к тегу перед отправкой
      tag = '@' + tag;
      
      registerBtn.disabled = true;
      registerBtn.textContent = 'Регистрация...';
      
      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        await user.updateProfile({
          displayName: nickname + '|' + tag
        });
        
        await db.collection('users').doc(user.uid).set({
          nickname: nickname,
          tag: tag, // Сохраняем тег уже с @
          email: email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        await user.sendEmailVerification();
        await auth.signOut();
        
        messageDiv.innerHTML = `
          <div class="success">
            <h3>✅ Регистрация успешна!</h3>
            <p>На почту ${email} отправлено письмо с подтверждением.</p>
            <p><a href="index.html" style="color: #667eea;">Перейти ко входу →</a></p>
          </div>
        `;
        
        document.getElementById('registerForm').style.display = 'none';
        
      } catch (error) {
        console.error('Ошибка регистрации:', error);
        
        registerBtn.disabled = false;
        registerBtn.textContent = 'Зарегистрироваться';
        
        let errorMessage = '';
        
        if (error.code === 'auth/network-request-failed') {
          errorMessage = '🌐 Проблема с интернетом. Проверьте подключение и попробуйте снова.';
        } else if (error.code === 'auth/email-already-in-use') {
          errorMessage = 'Этот email уже зарегистрирован';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Некорректный email';
        } else if (error.code === 'auth/weak-password') {
          errorMessage = 'Пароль должен быть минимум 6 символов';
        } else {
          errorMessage = 'Ошибка при регистрации. Попробуйте позже.';
        }
        
        messageDiv.innerHTML = `<div class="error">❌ ${errorMessage}</div>`;
      }
    });
  </script>
</body>
</html>
