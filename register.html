<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Регистрация</h1>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="nickname">Никнейм:</label>
        <input type="text" id="nickname" required>
      </div>
      
      <div class="form-group">
        <label for="tag">Тег (@):</label>
        <input type="text" id="tag" placeholder="@username" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" required minlength="6">
      </div>
      
      <button type="submit" id="registerBtn">Зарегистрироваться</button>
    </form>
    
    <p>Уже есть аккаунт? <a href="index.html">Войти</a></p>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    let lastEmail = '';
    
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nickname = document.getElementById('nickname').value;
      const tag = document.getElementById('tag').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      lastEmail = email;
      
      const registerBtn = document.getElementById('registerBtn');
      const messageDiv = document.getElementById('message');
      
      registerBtn.disabled = true;
      registerBtn.textContent = 'Регистрация...';
      messageDiv.innerHTML = '<div class="info">Создаем аккаунт...</div>';
      
      try {
        // Создаем пользователя
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Сохраняем ник и тег
        await user.updateProfile({
          displayName: nickname + '|' + tag
        });
        
        // Отправляем письмо
        await user.sendEmailVerification();
        
        // Выходим из аккаунта
        await auth.signOut();
        
        // Показываем сообщение с кнопкой повторной отправки
        messageDiv.innerHTML = `
          <div class="success">
            <h3>✅ Регистрация успешна!</h3>
            <p>На почту <strong>${email}</strong> отправлено письмо с подтверждением.</p>
            <p>Письмо может прийти в течение нескольких минут. Проверьте папку Спам.</p>
            <button onclick="resendVerification()" class="resend-btn">
              📧 Отправить письмо повторно
            </button>
            <p style="margin-top: 20px;">
              <a href="index.html">Перейти на страницу входа</a>
            </p>
          </div>
        `;
        
        // Прячем форму
        document.getElementById('registerForm').style.display = 'none';
        
      } catch (error) {
        registerBtn.disabled = false;
        registerBtn.textContent = 'Зарегистрироваться';
        
        let errorMessage = 'Ошибка при регистрации';
        if (error.code === 'auth/email-already-in-use') {
          errorMessage = 'Этот email уже зарегистрирован. <a href="index.html">Войти?</a>';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Некорректный email';
        } else if (error.code === 'auth/weak-password') {
          errorMessage = 'Пароль должен быть минимум 6 символов';
        }
        
        messageDiv.innerHTML = `<div class="error">❌ ${errorMessage}</div>`;
      }
    });
    
    // Функция повторной отправки письма
    window.resendVerification = async function() {
      const btn = event.target;
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = 'Отправка...';
      
      try {
        // Пробуем войти, чтобы отправить письмо повторно
        // Это костыль, но работает для повторной отправки
        const result = await auth.signInWithEmailAndPassword(lastEmail, '');
        // Не получится, но это не важно - мы просто хотим отправить письмо
      } catch (error) {
        // Игнорируем ошибку входа
      }
      
      // Показываем сообщение об отправке
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = messageDiv.innerHTML + 
        '<div class="info" style="margin-top: 10px;">Письмо отправлено! Проверьте почту.</div>';
      
      btn.disabled = false;
      btn.textContent = originalText;
    };
  </script>
</body>
</html>
