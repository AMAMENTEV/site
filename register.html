<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Регистрация</h1>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="nickname">Никнейм:</label>
        <input type="text" id="nickname" required>
      </div>
      
      <div class="form-group">
        <label for="tag">Тег (@):</label>
        <input type="text" id="tag" placeholder="@username" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" required minlength="6">
      </div>
      
      <button type="submit" id="registerBtn">Зарегистрироваться</button>
    </form>
    
    <p>Уже есть аккаунт? <a href="index.html">Войти</a></p>
    
    <div id="message" class="message"></div>
  </div>

  <!-- Подключаем ТОЛЬКО firebase-config.js, он уже содержит инициализацию -->
  <script src="firebase-config.js"></script>
  <script>
    // НЕ НАДО заново инициализировать Firebase!
    // auth и db уже есть из firebase-config.js
    
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nickname = document.getElementById('nickname').value;
      const tag = document.getElementById('tag').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const registerBtn = document.getElementById('registerBtn');
      const messageDiv = document.getElementById('message');
      
      registerBtn.disabled = true;
      registerBtn.textContent = 'Регистрация...';
      messageDiv.innerHTML = '<div class="info">Создаем аккаунт...</div>';
      
      try {
        // 1. Создаем пользователя в Auth
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // 2. Сохраняем ник и тег в Auth
        await user.updateProfile({
          displayName: nickname + '|' + tag
        });
        
        // 3. СОХРАНЯЕМ В FIRESTORE
        await db.collection('users').doc(user.uid).set({
          nickname: nickname,
          tag: tag,
          email: email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        console.log('Пользователь сохранен в Firestore:', user.uid);
        
        // 4. Отправляем письмо
        await user.sendEmailVerification();
        
        // 5. Выходим из аккаунта
        await auth.signOut();
        
        // 6. Показываем сообщение
        messageDiv.innerHTML = `
          <div class="success">
            <h3>✅ Регистрация успешна!</h3>
            <p>На почту <strong>${email}</strong> отправлено письмо с подтверждением.</p>
            <p>Проверьте папку Спам.</p>
            <p style="margin-top: 20px;">
              <a href="index.html">Перейти на страницу входа</a>
            </p>
          </div>
        `;
        
        // Прячем форму
        document.getElementById('registerForm').style.display = 'none';
        
      } catch (error) {
        console.error('Ошибка регистрации:', error);
        
        registerBtn.disabled = false;
        registerBtn.textContent = 'Зарегистрироваться';
        
        // ПОКАЗЫВАЕМ РЕАЛЬНУЮ ОШИБКУ
        messageDiv.innerHTML = `<div class="error">❌ ${error.message}</div>`;
      }
    });
  </script>
</body>
</html>
