<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Регистрация</h1>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="nickname">Никнейм:</label>
        <input type="text" id="nickname" required>
      </div>
      
      <div class="form-group">
        <label for="tag">Тег (@):</label>
        <input type="text" id="tag" placeholder="@username" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" required minlength="6">
      </div>
      
      <button type="submit" id="registerBtn">Зарегистрироваться</button>
    </form>
    
    <p>Есть аккаунт? <a href="index.html">Войти</a></p>
    
    <div id="message" class="message"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nickname = document.getElementById('nickname').value;
      const tag = document.getElementById('tag').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const registerBtn = document.getElementById('registerBtn');
      const messageDiv = document.getElementById('message');
      
      // Показываем сообщение о начале регистрации
      messageDiv.innerHTML = '<div class="info">Создаем аккаунт...</div>';
      registerBtn.disabled = true;
      registerBtn.textContent = 'Подождите...';
      
      try {
        // Создаем пользователя
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Обновляем профиль с ником
        await user.updateProfile({
          displayName: nickname + ' (' + tag + ')'
        });
        
        // Отправляем письмо для подтверждения
        await user.sendEmailVerification({
          url: window.location.origin + '/index.html'
        });
        
        // Выходим из аккаунта
        await auth.signOut();
        
        // Показываем сообщение об успехе с кнопкой повторной отправки
        messageDiv.innerHTML = `
          <div class="success">
            <h3>✅ Регистрация успешна!</h3>
            <p>На почту <strong>${email}</strong> отправлено письмо с подтверждением.</p>
            <p>Письмо может прийти в течение нескольких минут.</p>
            <button onclick="resendVerificationEmail('${email}')" class="resend-btn">
              Отправить письмо повторно
            </button>
            <p><a href="index.html">Перейти на страницу входа</a></p>
          </div>
        `;
        
        // Прячем форму регистрации
        document.getElementById('registerForm').style.display = 'none';
        
      } catch (error) {
        console.error(error);
        
        let errorMessage = 'Ошибка при регистрации';
        if (error.code === 'auth/email-already-in-use') {
          errorMessage = 'Этот email уже зарегистрирован';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Некорректный email';
        } else if (error.code === 'auth/weak-password') {
          errorMessage = 'Пароль должен быть минимум 6 символов';
        }
        
        messageDiv.innerHTML = `<div class="error">❌ ${errorMessage}</div>`;
        registerBtn.disabled = false;
        registerBtn.textContent = 'Зарегистрироваться';
      }
    });
    
    // Функция для повторной отправки письма
    window.resendVerificationEmail = async (email) => {
      try {
        // Пробуем войти, чтобы отправить письмо
        // Это костыль, но работает
        alert('Функция временно недоступна. Пожалуйста, проверьте папку Спам или попробуйте зарегистрироваться снова.');
      } catch (error) {
        alert('Ошибка при отправке письма');
      }
    };
  </script>
</body>
</html>
