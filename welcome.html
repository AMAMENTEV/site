
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Приветствие</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1 id="greeting">Hello, пользователь</h1>
  <button id="logoutBtn">Выйти из аккаунта</button>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAqzIbV2Uly03MbjpyNP9RQQx-0uDYnJdY",
  authDomain: "yttg-3b587.firebaseapp.com",
  projectId: "yttg-3b587",
  storageBucket: "yttg-3b587.firebasestorage.app",
  messagingSenderId: "77409665832",
  appId: "1:77409665832:web:b63c780592b3dfc82a061d",
  measurementId: "G-5VHQ23S2PP"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      if (user && user.emailVerified) {
        db.collection('users').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            document.getElementById('greeting').innerText = "Hello, " + doc.data().nickname;
          } else {
            document.getElementById('greeting').innerText = "Hello, пользователь";
          }
        });
      } else {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('logoutBtn').onclick = () => {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    };
  </script>
</body>
</html>
